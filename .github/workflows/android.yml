name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'study-engine-v83/android-app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        working-directory: study-engine-v83/android-app
        run: npm install --no-audit --no-fund

      - name: Copy web assets and plugin config into the Android project
        working-directory: study-engine-v83/android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: study-engine-v83/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-engine-apk
          path: study-engine-v83/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # The same APK as a plain download link that never changes, so the phone can install it
      # straight from Chrome — no zip to extract:
      # https://github.com/hpsingh720/study-engine/releases/download/apk/study-engine.apk
      - name: Publish the APK as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp study-engine-v83/android-app/android/app/build/outputs/apk/debug/app-debug.apk study-engine.apk
          gh release view apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create apk --repo "$GITHUB_REPOSITORY" --title "Study Engine Android app" --notes "The newest Android app. Install it over the old one; do not uninstall." --target "$GITHUB_SHA"
          gh release upload apk study-engine.apk --clobber --repo "$GITHUB_REPOSITORY"
